[project]
name = "sord"
version = "0.1.0"
description = "Spread or Rediscovery? Technique diffusion in the collusion.wiki agent swarm"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]
license = {text = "MIT"}
authors = [{name = "Fatimah Emad Eldin"}]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
